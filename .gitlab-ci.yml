stages:
  - manual
  - test
  - build
  - deploy
  - publish

test-isort:
  image: registry.gitlab.com/gajim/python-nbxmpp/build-test:latest
  stage: test
  rules:
    - when: always
  script:
    - isort --version
    - isort --check .
  interruptible: true

test-black:
  image: registry.gitlab.com/gajim/python-nbxmpp/build-test:latest
  stage: test
  rules:
    - when: always
  script:
    - black --version
    - black --check .
  interruptible: true

test-ruff:
  image: registry.gitlab.com/gajim/python-nbxmpp/build-test:latest
  stage: test
  rules:
    - when: always
  script:
    - ruff --version
    - ruff check .
  interruptible: true

test-pyright:
  image: registry.gitlab.com/gajim/python-nbxmpp/build-test:latest
  stage: test
  rules:
    - when: always
  script:
    - pip install pygobject-stubs==2.16.0
    - pyright --version
    - pyright
  interruptible: true

test-unittest:
  image: registry.gitlab.com/gajim/python-nbxmpp/build-test:latest
  stage: test
  rules:
    - when: always
  script:
    - python -m unittest discover -v
  interruptible: true

build-unix:
  image: registry.gitlab.com/gajim/python-nbxmpp/build-test:latest
  stage: build
  dependencies: []
  rules:
    - when: always
  script:
    - pip install git+https://gitlab.com/gajim/release-helper.git
    - pip install build
    - python3 -m build
    - release-helper build-debian-pkg "$(find dist/nbxmpp-*.tar.gz)" 1 --pkgprefix=python3 --pkgsuffix=nightly

  artifacts:
    name: "nbxmpp-$CI_COMMIT_SHA"
    expire_in: 1 week
    paths:
      - dist/nbxmpp-*.tar.gz
      - dist/nbxmpp-*.whl
      - debian_build/*

deploy-pypi:
  image: registry.gitlab.com/gajim/python-nbxmpp/deploy:latest
  stage: deploy
  dependencies:
    - "build-unix"
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - twine upload --username=__token__ --password=$PYPI_TOKEN dist/*

deploy-debian-nightly:
  image: registry.gitlab.com/gajim/python-nbxmpp/deploy:latest
  stage: deploy
  dependencies:
    - build-unix
  rules:
    - if: '$NIGHTLY_BUILD'
  allow_failure:
    exit_codes:
      - 100
  script:
    - |
      if [ "$FORCE_DEB_DEPLOY" != "true" ]
      then
        release-helper nightly-check
      fi
    - >
      release-helper deploy-to-ftp \
        --host=$FTP_HOST \
        --user=$FTP_USER \
        --password=$FTP_PASS \
        --directory=debian/nbxmpp/"$(date +'%Y%m%d')" \
        debian_build

publish-release:
  image: registry.gitlab.com/gajim/python-nbxmpp/publish:latest
  stage: publish
  dependencies: []
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - >
      release-helper create-release \
        $CI_PROJECT_ID \
        $CI_RELEASE_TOKEN \
        --version=$CI_COMMIT_TAG \
        --tag=$CI_COMMIT_TAG

build-docker-image:
  image: docker:29.9.1-cli-alpine3.24
  stage: manual
  rules:
    - if: '$DOCKER_IMAGE'
  tags:
    - docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  services:
    - docker:29.9.1-dind-alpine3.24
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $CI_REGISTRY/gajim/gajim/$DOCKER_IMAGE:latest docker/$DOCKER_IMAGE
    - docker push $CI_REGISTRY/gajim/gajim/$DOCKER_IMAGE:latest
